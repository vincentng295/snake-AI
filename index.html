<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#cfeaff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rắn AI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Rắn Săn Đáp Án AI</title>
<style>
:root{
  --sky:#cfeaff; --ink:#14306b; --white:#fff;
  --green:#2fbf71; --heart:#ff3d5a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--sky);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;font-weight:700;touch-action:pan-x pan-y}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}

#app{position:fixed;inset:0;display:grid;gap:8px;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto auto minmax(0,1fr) auto;
  grid-template-areas:"hud" "q" "stage" "pad"}
@media (min-aspect-ratio:11/10){
  #app{grid-template-columns:minmax(0,1fr) minmax(300px,36%);grid-template-rows:auto auto 1fr;
    grid-template-areas:"stage hud" "stage q" "stage pad"}
  #pad{align-self:end}
}

/* ---------- HUD ---------- */
#hud{grid-area:hud;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#hearts{display:flex;flex-wrap:wrap;gap:1px;margin-right:auto;max-width:250px}
.h{width:22px;height:22px}
.h path{fill:var(--heart);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.h.off path{fill:#fff;opacity:.5}
.pill{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:3px 10px;box-shadow:0 3px 0 var(--ink);
  display:flex;flex-direction:column;line-height:1.05;min-width:62px}
.pill small{font-size:11px;font-weight:700;opacity:.7}
.pill b{font-size:19px;font-weight:800}
.ib{width:42px;height:42px;border-radius:13px;border:3px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink);
  display:grid;place-items:center;padding:0}
.ib:active,.btn:active,#pad button:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.ib svg{width:22px;height:22px;fill:var(--ink)}
.ib svg .ln{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}

/* ---------- Question card ---------- */
#q{grid-area:q;background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:10px 12px;min-height:0;overflow:auto}
#qtext{margin:0 0 8px;font-size:clamp(16px,4.4vw,21px);line-height:1.3;font-weight:800}
#answers{display:grid;gap:6px}
@media (min-width:560px) and (max-aspect-ratio:11/10){#answers{grid-template-columns:1fr 1fr}}
.ans{display:flex;gap:10px;align-items:center;padding:5px 8px 5px 5px;border-radius:12px;background:#f1f8ff;border:2px solid var(--ink);
  font-size:clamp(14px,3.7vw,17px);line-height:1.25}
.ans b{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--bg);color:var(--fg);
  border:2px solid var(--ink);font-size:17px;font-weight:800}
.c0{--bg:#ff5d73;--fg:#fff}.c1{--bg:#ffb703;--fg:#14306b}.c2{--bg:#8b5cf6;--fg:#fff}.c3{--bg:#1e90ff;--fg:#fff}
@media (min-aspect-ratio:11/10){
  #qtext{font-size:clamp(18px,2.1vw,26px)}
  .ans{font-size:clamp(15px,1.7vw,20px)}
  .ans b{width:34px;height:34px}
}


/* ---------- Điện thoại ngang: thu nhỏ để câu hỏi + đáp án không bị cắt ---------- */
@media (orientation:landscape) and (max-height:520px){
  #app{gap:4px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"stage hud" "stage q" "stage pad"}
  #hud{gap:4px}
  #hearts{max-width:none}
  .h{width:16px;height:16px}
  .pill{padding:1px 6px;min-width:46px;border-width:2px;border-radius:10px;box-shadow:0 2px 0 var(--ink)}
  .pill small{font-size:9px}.pill b{font-size:13px}
  .ib{width:30px;height:30px;border-radius:9px;border-width:2px;box-shadow:0 2px 0 var(--ink)}
  .ib svg{width:16px;height:16px}
  #q{padding:5px 8px;border-width:2px;border-radius:12px;box-shadow:0 2px 0 var(--ink);overflow-y:auto}
  #qtext{font-size:12px;line-height:1.25;margin:0 0 4px}
  #answers{gap:3px;grid-template-columns:1fr}
  .ans{font-size:12px;line-height:1.2;padding:2px 6px 2px 3px;gap:6px;border-width:1.5px;border-radius:8px}
  .ans b{width:20px;height:20px;font-size:12px;border-radius:6px;border-width:1.5px}
  #pad{grid-template-rows:repeat(2,38px);gap:4px;width:min(100%,190px)}
  #pad button{border-width:2px;border-radius:10px;box-shadow:0 2px 0 var(--ink)}
  #pad svg{width:22px;height:22px}
}
/* ---------- Board ---------- */
#stage{grid-area:stage;position:relative;display:grid;place-items:center;min-height:0;min-width:0;padding:4px 6px 14px}
#wrap{position:relative;border-radius:16px;box-shadow:0 0 0 3px var(--ink),0 8px 0 3px var(--ink);background:#f1f9ff}
#cv{display:block;width:100%;height:100%;border-radius:16px;touch-action:none}
#toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-14px);opacity:0;pointer-events:none;white-space:nowrap;
  padding:6px 14px;border-radius:999px;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:16px;font-weight:800;
  transition:opacity .15s,transform .15s;background:#fff}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{background:#b9f3cf}#toast.bad{background:#ffc9d1}
.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* ---------- D-pad (touch devices) ---------- */
#pad{grid-area:pad;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,clamp(50px,9vmin,78px));gap:8px;justify-self:center;width:min(100%,clamp(250px,36vmin,360px))}
#pad button{border:3px solid var(--ink);border-radius:15px;background:#fff;box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:0}
#pad svg{width:clamp(26px,5vmin,40px);height:clamp(26px,5vmin,40px);fill:var(--ink)}
#pad .up{grid-column:2;grid-row:1}
#pad .left{grid-column:1;grid-row:2}
#pad .down{grid-column:2;grid-row:2}
#pad .right{grid-column:3;grid-row:2}
#pad .left svg{transform:rotate(-90deg)}
#pad .right svg{transform:rotate(90deg)}
#pad .down svg{transform:rotate(180deg)}

/* ---------- Overlay cards ---------- */
#ov{position:fixed;inset:0;z-index:20;display:grid;padding:16px;overflow:auto;background:rgba(207,234,255,.88);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#ov[hidden]{display:none}
.card{margin:auto;width:min(460px,100%);background:#fff;border:3px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:18px 20px 22px}
.card h1{margin:4px 0 6px;font-size:clamp(28px,8vw,38px);line-height:1.05;font-weight:800}
.card h2{margin:0 0 8px;font-size:26px;line-height:1.1;font-weight:800}
.card p{margin:0 0 10px;line-height:1.4;font-weight:700}
.logo{display:block;width:100%;max-width:240px;height:auto;margin-bottom:4px}
.rules{list-style:none;margin:10px 0 12px;padding:0;display:grid;gap:7px}
.rules li{display:flex;align-items:center;gap:10px;font-size:16px}
.chip{flex:none;min-width:44px;text-align:center;font-style:normal;font-weight:800;padding:3px 8px;border-radius:10px;border:2px solid var(--ink);background:var(--bg);color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:3px solid var(--ink);border-radius:16px;background:#ffb703;box-shadow:0 4px 0 var(--ink);padding:11px 20px;font-size:18px;font-weight:800}
.btn.alt{background:#fff;font-size:15px;padding:8px 14px}
.btn.big{width:100%}
.note{padding:8px 10px;border-radius:12px;border:2px solid var(--ink);font-size:14px;margin:0 0 10px}
.note.ok{background:#b9f3cf}.note.bad{background:#ffc9d1}.note.info{background:#e6f2ff}
.best{display:flex;align-items:baseline;gap:8px;margin:6px 0 4px;font-size:16px}
.best b{font-size:28px;font-weight:800}
.top{margin:6px 0 0;padding-left:22px;font-size:14px;display:grid;gap:2px}
.top small{opacity:.65;margin-left:6px;font-weight:700}
.bigscore{font-size:56px;line-height:1;font-weight:800;margin:4px 0 8px}
.badge{display:inline-block;background:#ffb703;border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:14px;margin-bottom:8px;font-weight:800}
.exp{font-size:15px;background:#f1f8ff;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;margin:10px 0 0}
.mini{font-size:13px;opacity:.75;margin-top:10px}
.hearts-left{display:flex;gap:2px;margin:0 0 8px}

.inp{width:100%;padding:12px 14px;border:3px solid var(--ink);border-radius:14px;font:inherit;font-size:18px;-webkit-user-select:text;user-select:text;background:#f1f8ff;color:var(--ink)}
.online-only{display:none}#app.net .online-only{display:flex}
.ans.right{background:#b9f3cf}.ans.dim{opacity:.45}
.pill.mid b{color:#b36b00}.pill.bad b{color:#c01f3a}
.spec-only{display:none}#app.spec .spec-only{display:flex}
#app.spec #hearts,#app.spec #scorePill,#app.spec #bestPill,#app.spec #pad{display:none}
#netbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);max-width:92%;padding:6px 14px;border-radius:999px;border:3px solid var(--ink);
  box-shadow:0 3px 0 var(--ink);font-size:14px;font-weight:800;background:#fff3bf;pointer-events:none;text-align:center;z-index:3}
#netbar[hidden]{display:none}
#specbar{grid-area:pad;display:none;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
#app.spec #specbar{display:flex}
#specName{flex:1 1 150px;min-width:130px;text-align:center;line-height:1.2;font-size:clamp(14px,3.6vw,17px);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;box-shadow:0 3px 0 var(--ink)}
#specbar .btn.alt{padding:8px 12px;font-size:14px}
@media (prefers-reduced-motion:reduce){.shake{animation:none}#toast{transition:none}}
.qrbox{display:block;width:min(100%,300px);aspect-ratio:1;margin:8px auto;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px}
.qrbox svg{display:block;width:100%;height:100%}
.qrurl{font-size:14px;line-height:1.3;text-align:center;word-break:break-all;-webkit-user-select:text;user-select:text;background:#f1f8ff;border:2px solid var(--ink);border-radius:12px;padding:6px 10px;margin:0 0 10px}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div id="hearts" role="img" aria-label="Số tim còn lại"></div>
    <div class="pill spec-only"><small>Chế độ</small><b>Khán giả</b></div>
    <div class="pill" id="scorePill"><small>Điểm</small><b id="score">0</b></div>
    <div class="pill" id="bestPill"><small>Cao nhất</small><b id="best">0</b></div>
    <div class="pill online-only"><small>Câu hỏi</small><b id="timeV">0</b></div>
    <div class="pill online-only" id="pingPill"><small>Ping</small><b id="pingV">-</b></div>
    <button class="ib" id="btnQr" aria-label="Hiện mã QR của trang"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zm2 2v4h4V5zM13 3h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zM13 13h3v3h-3zm5 0h3v3h-3zm-5 5h3v3h-3zm5 0h3v3h-3z"/></svg></button>
    <button class="ib" id="btnSound" aria-label="Bật hoặc tắt âm thanh"></button>
    <button class="ib" id="btnFs" aria-label="Toàn màn hình" hidden></button>
    <button class="ib" id="btnPause" aria-label="Tạm dừng">
      <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
    </button>
  </header>

  <section id="q" aria-live="polite">
    <p id="qtext"></p>
    <div id="answers"></div>
    <div id="qexp" class="exp" hidden></div>
  </section>

  <main id="stage">
    <div id="wrap">
      <canvas id="cv"></canvas>
      <div id="toast" role="status"></div>
      <div id="netbar" role="status" hidden></div>
    </div>
  </main>

  <nav id="pad" aria-label="Nút điều khiển">
    <button class="up" data-dir="up" aria-label="Lên"><svg viewBox="0 0 24 24"><path d="M12 5l9 14H3z"/></svg></button>
    <button class="left" data-dir="left" aria-label="Trái"><svg viewBox="0 0 24 24"><path d="M12 5l9 14H3z"/></svg></button>
    <button class="down" data-dir="down" aria-label="Xuống"><svg viewBox="0 0 24 24"><path d="M12 5l9 14H3z"/></svg></button>
    <button class="right" data-dir="right" aria-label="Phải"><svg viewBox="0 0 24 24"><path d="M12 5l9 14H3z"/></svg></button>
  </nav>
  <nav id="specbar" aria-label="Điều khiển khán giả">
    <button class="ib" data-spec="prev" aria-label="Người chơi trước">&#9664;</button>
    <div id="specName" role="status"></div>
    <button class="ib" data-spec="next" aria-label="Người chơi sau">&#9654;</button>
    <button class="btn alt" id="specMode" data-spec="mode">Toàn cảnh</button>
    <button class="btn alt" data-spec="join">Vào chơi</button>
  </nav>
</div>

<div id="ov" hidden></div>
<noscript>Game cần bật JavaScript để chạy.</noscript>

<script>
(() => {
'use strict';

/* ================= CẤU HÌNH (sửa tại đây) ================= */
const CONFIG = {
  COLS: 26, ROWS: 26,          // kích thước sân
  HEARTS: 5, HEARTS_MAX: 10,   // tim ban đầu / tối đa
  HEART_EVERY: 16, HEART_LIFE: 14, HEART_FULL_BONUS: 3,  // trái tim trên sân: trung bình 16 giây một lần, tồn tại 14 giây
  SERVER_URL: 'https://snake-ai.huskydg.io.vn',  // máy chủ chơi online
  VIEW: 21,                    // chế độ online: số ô nhìn thấy mỗi chiều
  SPEC_VIEW: 25,               // khán giả (chế độ theo dõi 1 người): số ô nhìn thấy mỗi chiều
  SOCKET_LIB_LOCAL: 'socket_io_min.js',                           // thư viện Socket.IO cùng thư mục (ưu tiên)
  SOCKET_LIB_CDN: 'https://cdn.socket.io/4.8.4/socket.io.min.js', // dự phòng
                    // số tim ban đầu
  POINTS: 10,                  // điểm khi ăn đúng
  STREAK_BONUS: 2,             // thưởng thêm cho mỗi câu đúng liên tiếp
  STREAK_BONUS_MAX: 5,         // tối đa số lần cộng thưởng
  GROW: 2,                     // rắn dài thêm bao nhiêu đốt sau mỗi câu đúng
  SPEED_START: 170,            // ms mỗi bước (càng nhỏ càng nhanh)
  SPEED_MIN: 90,
  SPEED_STEP: 8,               // mỗi SPEED_EVERY câu đúng, rắn nhanh hơn SPEED_STEP ms
  SPEED_EVERY: 4,
  WALL_WRAP: true,             // true: đi xuyên tường; false: đụng tường mất 1 tim
  MIN_SPAWN_DIST: 4            // đáp án xuất hiện cách đầu rắn tối thiểu bấy nhiêu ô
};
const { COLS, ROWS } = CONFIG;
const LETTERS = ['A', 'B', 'C', 'D'];
const COLORS = [
  { bg: '#ff5d73', fg: '#ffffff' },
  { bg: '#ffb703', fg: '#14306b' },
  { bg: '#8b5cf6', fg: '#ffffff' },
  { bg: '#1e90ff', fg: '#ffffff' }
];
const INK = '#14306b';
const K = { best: 'snakeai.best', hist: 'snakeai.history', sound: 'snakeai.sound', name: 'snakeai.name', token: 'snakeai.token' };

/* Câu hỏi dự phòng nếu không đọc được question.json (ví dụ mở trực tiếp file://) */
const FALLBACK = [
  { question: 'AI là viết tắt của cụm từ nào?', correct: 'Artificial Intelligence (Trí tuệ nhân tạo)', wrong: ['Automatic Internet (Mạng tự động)', 'Awesome Idea (Ý tưởng tuyệt vời)', 'Animal Index (Chỉ số động vật)'], explanation: 'AI là Artificial Intelligence: trí tuệ nhân tạo.' },
  { question: 'Dữ liệu (data) là gì?', correct: 'Thông tin như chữ, ảnh, âm thanh, con số', wrong: ['Một loại nhạc cụ', 'Một loại đồ ăn vặt', 'Một loại cây'], explanation: 'AI học từ dữ liệu.' },
  { question: 'AI có thể trả lời sai không?', correct: 'Có, AI đôi khi trả lời sai', wrong: ['Không, AI luôn đúng 100%', 'Không, AI không bao giờ sai'], explanation: 'Hãy kiểm tra lại thông tin quan trọng.' }
];

/* ================= Tiện ích ================= */
const $ = (id) => document.getElementById(id);
const now = () => performance.now();
const rand = (n) => Math.floor(Math.random() * n);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const str = (v) => (typeof v === 'string' || typeof v === 'number') ? String(v).trim() : '';
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const vib = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

const cv = $('cv'), ctx = cv.getContext('2d');
const wrap = $('wrap'), stage = $('stage'), ov = $('ov'), toastEl = $('toast');
let CELL = 24, dprCap = 2;   // dprCap: giới hạn độ phân giải canvas (tự giảm nếu máy yếu)

/* ================= Âm thanh ================= */
let ac = null, soundOn = store.get(K.sound, true);
function ensureAudio() {
  try {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
    if (ac && ac.state === 'suspended') ac.resume();
  } catch (e) {}
}
function tone(f, t0, d, type, vol) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + t0;
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol || 0.18, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + d + 0.03);
}
function sfx(k) {
  if (!soundOn || !ac) return;
  if (k === 'ok') { tone(660, 0, .12, 'triangle'); tone(990, .1, .2, 'triangle'); }
  else if (k === 'bad') { tone(220, 0, .2, 'sawtooth', .1); tone(165, .16, .28, 'sawtooth', .1); }
  else if (k === 'hurt') { tone(180, 0, .3, 'square', .08); }
  else if (k === 'over') { [392, 330, 262, 196].forEach((f, i) => tone(f, i * .18, .28, 'triangle')); }
}
const ICON_ON = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="ln" d="M16 8.6a4.8 4.8 0 010 6.800M18.600 6a8.500 8.500 0 010 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="ln" d="M16.500 9.500l5 5M21.500 9.500l-5 5"/></svg>';
function paintSound() { $('btnSound').innerHTML = soundOn ? ICON_ON : ICON_OFF; }

/* ================= Câu hỏi ================= */
let Q = [], deck = [], cur = null, loadNote = '';
function normalize(data) {
  const arr = Array.isArray(data) ? data : (data && Array.isArray(data.questions) ? data.questions : []);
  const out = [];
  for (const it of arr) {
    if (!it || typeof it !== 'object') continue;
    const question = str(it.question !== undefined ? it.question : it.q);
    const correct = str(it.correct !== undefined ? it.correct : it.answer);
    const w = it.wrong !== undefined ? it.wrong : (it.wrongs !== undefined ? it.wrongs : it.incorrect);
    const wrong = (Array.isArray(w) ? w : [w]).map(str).filter(Boolean);
    const explanation = str(it.explanation !== undefined ? it.explanation : it.explain);
    if (question && correct && wrong.length) out.push({ question, correct, wrong, explanation });

}

  try {
    const r = await fetch('question.json', { cache: 'no-cache' });
    if (r.ok) list = normalize(await r.json());
  } catch (e) {}
  if (!list.length) {
    list = normalize(FALLBACK);
    loadNote = 'Không đọc được question.json nên đang dùng vài câu hỏi mẫu. Hãy kiểm tra file question.json có nằm cùng thư mục với index.html và mở game qua http(s).';

function nextQuestion() {
  if (!deck.length) deck = shuffle(Q.map((_, i) => i));
  const q = Q[deck.pop()];
  const wrong = shuffle(q.wrong.slice()).slice(0, 3);
  const options = shuffle([{ text: q.correct, ok: true }, ...wrong.map((t) => ({ text: t, ok: false }))]);
  cur = { question: q.question, explanation: q.explanation, correct: q.correct, options };
  $('qtext').textContent = cur.question;
  $('answers').innerHTML = options.map((o, i) =>

  if (queue.length < 2) queue.push({ x: dx, y: dy });

function step() {
  if (queue.length) dir = queue.shift();
  const h = snake[0];
  let nx = h.x + dir.x, ny = h.y + dir.y;
  if (CONFIG.WALL_WRAP) { nx = (nx + COLS) % COLS; ny = (ny + ROWS) % ROWS; }
  const wall = nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS;
  const body = grow > 0 ? snake : snake.slice(0, -1);
  if (wall || body.some((s) => s.x === nx && s.y === ny)) return crash(wall ? 'Đụng tường!' : 'Cắn trúng đuôi!');
  const old = snake.map((s) => ({ x: s.x, y: s.y }));
  snake.unshift({ x: nx, y: ny });
  if (grow > 0) grow--; else snake.pop();

  if (k >= 0) eat(items[k]);

  if (it.ok) {
    streak++;

    score += gain; correctCount++; grow += CONFIG.GROW;
    if (score > best) { best = score; store.set(K.best, best); }
    if (correctCount % CONFIG.SPEED_EVERY === 0) tickMs = Math.max(CONFIG.SPEED_MIN, tickMs - CONFIG.SPEED_STEP);
    sfx('ok'); vib(20); updateHud();
    toast('Đúng rồi! +' + gain + (streak > 1 ? '  (liên tiếp ' + streak + ')' : ''), 'ok');

    streak = 0; hearts--; updateHud(); shake(); sfx('bad'); vib(120);

/* ---- thông báo mạng + đo hiệu năng ---- */
let netBarMsg = '';

/* ---- bản đồ: đất nhà (Y), mái nhà (H), cửa (D), tường (W), cây (T) ---- */
function tileAt(x, y) {

}

/* ---- dự đoán phía client: rắn của mình chạy ngay theo phím, server chỉ xác nhận ---- */
function tileSolid(x, y) { const c = tileAt(x, y); return c === 'W' || c === 'T' || c === 'H' || c === 'D'; }
function onSnk(d) {   // server đặt lại rắn của mình (vào phòng, hồi sinh, đồng bộ lại)
  if (net.me && d.ep <= net.me.ep) return;
  const cells = []; for (let i = 0; i < d.c.length; i += 2) cells.push({ x: d.c[i], y: d.c[i + 1] });
  net.me = { cells, from: cells.map((c) => ({ x: c.x, y: c.y })), dir: { x: d.d[0], y: d.d[1] }, queue: [], grow: 0, ep: d.ep, t0: 0, frozen: 0 };
}
function meStep(ts) {
  const m = net.me; if (!m || state !== 'play' || !net.joined || net.spec) return;
  const tick = net.tick, W = net.W;
  if (!m.t0 || ts - m.t0 > tick * 4) m.t0 = ts;
  if (m.frozen) {   // đụng vật cản: chờ server cho hồi sinh (quá 1 giây thì xin đồng bộ lại)
    if (ts - m.frozen > 1000) { m.frozen = ts; if (net.sock) net.sock.emit('sync'); }
    m.t0 = ts; return;
  }
  while (ts - m.t0 >= tick) {
    m.t0 += tick;
    if (m.queue.length) m.dir = m.queue.shift();
    const h = m.cells[0], nx = (h.x + m.dir.x + W) % W, ny = (h.y + m.dir.y + W) % W;
    if (net.sock) net.sock.emit('mv', { x: nx, y: ny, ep: m.ep });
    if (tileSolid(nx, ny)) { m.frozen = ts; return; }
    const old = m.cells.map((c) => ({ x: c.x, y: c.y }));
    m.cells.unshift({ x: nx, y: ny });

function meOut(ts) {

}

/* ---- vẽ ---- */
function drawOnline(ts) {
  frameStats(ts); meStep(ts);
  const fr = advanceClock(ts), c = CELL, V = VC, W = net.W, size = c * V;
  ctx.clearRect(0, 0, size, size);
  if (!fr) return;

  const mA = A ? snapMap(A) : null;
  if (B) for (const pb of B.s) list.push({ p: pb, o: sampleSnake(mA ? mA.get(pb[0]) : null, pb, fr.rk, A, B) });
  else for (const pa of A.s) list.push({ p: pa, o: sampleSnake(pa, null, fr.rk, A, null) });

  net.camId = camId;
  const me = list.find((o) => o.p[0] === camId);

  const half = (V - 1) / 2, cx = net.cam[0], cy = net.cam[1];
  let P;

    P = (x, y) => [(((x % W) + W) % W + 0.5) * c, (((y % W) + W) % W + 0.5) * c];
    for (let j = 0; j < W; j++) for (let i = 0; i < W; i++) { ctx.fillStyle = (i + j) & 1 ? '#e3f2ff' : '#f1f9ff'; ctx.fillRect(i * c, j * c, c, c); const ch = tileAt(i, j); if (ch !== '.') drawTile(ch, i * c, j * c, c, (i + j) & 1); }
  } else {
    P = (x, y) => [(half + 0.5 + wrapD(x - cx, W)) * c, (half + 0.5 + wrapD(y - cy, W)) * c];
    const x0 = Math.floor(cx) - half - 1, y0 = Math.floor(cy) - half - 1;
    for (let j = 0; j < V + 3; j++) for (let i = 0; i < V + 3; i++) {
      const wx = x0 + i, wy = y0 + j, q = P(wx, wy);
      ctx.fillStyle = (wx + wy) & 1 ? '#e3f2ff' : '#f1f9ff';
      ctx.fillRect(q[0] - c / 2, q[1] - c / 2, c + 0.6, c + 0.6);
      const ch = tileAt(wx, wy); if (ch !== '.') drawTile(ch, q[0] - c / 2, q[1] - c / 2, c, (wx + wy) & 1);

  for (const hh of base.hr) { const q = P(hh[0], hh[1]); if (inView(q)) drawHeart(q[0], q[1], ts, hh[2]); else { const e = clampP(q); drawHeart(e[0], e[1], ts, hh[2], 0.7); } }
  for (const it of base.it) { const q = P(it[1], it[2]); if (inView(q)) drawItem(q[0], q[1], it[0], ts); else { const e = clampP(q); drawItem(e[0], e[1], it[0], ts, 0.7); } }

  const fs = Math.max(ov ? 9 : 11, Math.round(c * (ov ? 0.8 : 0.5)));

    const pts = o.o.pts.map((q) => { const e = P(q[0], q[1]); return { x: e[0], y: e[1] }; });

    const d = o.o.d;
    paintSnake(pts, { x: d[4], y: d[5] }, PAL[o.p[2] % PAL.length], ts, o.p[8] && Math.floor(ts / 150) % 2 ? 0.4 : 1);
    ctx.font = `800 ${fs}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    const label = net.spec ? o.p[1] + ' ♥' + o.p[6] : o.p[1];
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(label, pts[0].x, pts[0].y - c * 0.85);
    ctx.fillStyle = (!ov && o.p[0] === camId) ? '#d6336c' : INK; ctx.fillText(label, pts[0].x, pts[0].y - c * 0.85);
  }

    const txt = ov ? 'Toàn cảnh · ' + list.length + ' rắn đang chơi' : me ? me.p[1] + ' · ' + me.p[7] + ' điểm · ♥' + me.p[6] : 'Chưa có người chơi';
    if (txt !== net.specTxt) { net.specTxt = txt; $('specName').textContent = txt; }
  }
  // bảng xếp hạng + tin nhanh

  const lb = base.lb;

    ctx.fillStyle = 'rgba(255,255,255,.82)'; rr(6, 6, fs * 10, fs * 1.3 * lb.length + 10, 10); ctx.fill();
    lb.forEach((r, i) => { ctx.fillStyle = INK; ctx.fillText((i + 1) + '. ' + r[0].slice(0, 10), 12, 6 + fs * 1.3 * (i + 1)); ctx.textAlign = 'right'; ctx.fillText(r[1], fs * 10, 6 + fs * 1.3 * (i + 1)); ctx.textAlign = 'left'; });
  }
  const t = Date.now(); net.feed = net.feed.filter((f) => t - f.t < 7000);
  net.feed.slice(-4).forEach((f, i, a) => {
    const y = size - 8 - (a.length - 1 - i) * fs * 1.3;
    ctx.fillStyle = f.k === 'ok' ? '#0a7a3d' : f.k === 'bad' ? '#c01f3a' : INK;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.strokeText(f.m, 8, y); ctx.fillText(f.m, 8, y);
  });
}

/* ---- kết nối ---- */
let serverP = null;
// Nếu trang này do chính main.py phục vụ (chạy nội bộ) thì nối thẳng về cùng địa chỉ; ngược lại dùng CONFIG.SERVER_URL.
function resolveServer() {
  if (serverP) return serverP;
  serverP = (async () => {
    let failed = false, url = CONFIG.SERVER_URL;
    if (/^https?:$/.test(location.protocol)) {
      try {
        const ctl = 'AbortController' in window ? new AbortController() : null;
        const kill = setTimeout(() => { if (ctl) ctl.abort(); }, 2500);
        const r = await fetch(new URL('health', location.href).href, { cache: 'no-store', signal: ctl ? ctl.signal : undefined });
        clearTimeout(kill);
        if (r.ok && (await r.text()).trim() === 'ok') url = location.origin;
      } catch (e) { failed = true; }
    }
    if (failed) serverP = null;   // lỗi tạm thời: lần sau thử lại
    return url;
  })();
  return serverP;
}

// Mở kết nối Socket.IO rồi gọi onConnect mỗi lần (kể cả lúc tự nối lại) kết nối thành công.

      e.hidden = false;
    });
    s.on('feed', (d) => { net.feed.push({ m: d.m, k: d.k, t: Date.now() }); });
    s.on('ev', onEv);
    s.on('snk', onSnk);
    s.on('afk', () => { state = 'pause'; showOverlay(menuHtml()); });
    s.on('kicked', (d) => { restoreOffline(); showStart((d && d.reason) || 'Bạn đã bị ngắt kết nối', 'bad'); });
  }).catch(() => { onFail(); });
}
function joinClick() {
  const inp = $('nameIn'); if (!inp) return;
  const name = inp.value.replace(/\s+/g, ' ').trim();
  if (name.length < 2) return showNameCard('Tên quá ngắn (tối thiểu 2 ký tự)');
  store.set(K.name, name); net.name = name; net.spec = false;
  showOverlay(waitHtml('Đang kết nối máy chủ...'));
  openSocket(doJoin, () => { restoreOffline(); showNameCard('Không tải được thư viện online. Hãy kiểm tra mạng.'); });
}
function doJoin() {
  let tok = store.get(K.token, '');
  if (!tok) { tok = Math.random().toString(36).slice(2) + Date.now().toString(36); store.set(K.token, tok); }
  net.sock.emit('join', { name: net.name, token: tok }, (r) => {
    if (!r || !r.ok) { const msg = (r && r.error) || 'Không vào được phòng'; restoreOffline(); showNameCard(msg); return; }
    resetPlayback(r); net.id = r.id; net.spec = false; net.GROW = r.grow || 2; net.maxLen = r.maxLen || 40;
    mode = 'online'; $('app').classList.add('net'); $('app').classList.remove('spec');
    maxHearts = r.heartsMax; hearts = r.hearts; score = r.score; best = r.best;
    VC = VR = Math.min(CONFIG.VIEW, 2 * (net.ir - 4) + 1); fit(); updateHud();
    if (r.dead) { state = 'over'; showOverlay(deadHtml()); } else { state = 'play'; hideOverlay(); }
  });
}

/* ---- chế độ khán giả ---- */
function spectateClick() {
  if (net.sock && net.joined && !net.spec) { try { net.sock.emit('leave'); } catch (e) {} }   // đang là người chơi (vd hết tim): rời phòng rồi xem
  if (net.sock) netStop();
  net.spec = true;
  showOverlay(waitHtml('Đang kết nối máy chủ...'));
  openSocket(doSpectate, () => { restoreOffline(); showStart('Không tải được thư viện online. Hãy kiểm tra mạng.', 'bad'); });
}
function doSpectate() {
  net.sock.emit('spectate', null, (r) => {
    if (!r || !r.ok) { const msg = (r && r.error) || 'Không vào xem được'; restoreOffline(); showStart(msg, 'bad'); return; }
    resetPlayback(r); net.id = 0; net.spec = true; net.camId = 0; net.specTxt = '';
    if (net.follow === null && !net.everSet) { net.overview = Math.min(stage.clientWidth, stage.clientHeight) >= 520; net.everSet = true; }
    mode = 'online'; $('app').classList.add('net', 'spec');
    $('btnPause').innerHTML = EXIT_SVG; $('btnPause').setAttribute('aria-label', 'Thoát chế độ xem');
    maxHearts = r.heartsMax;
    paintSpecMode(); state = 'watch'; hideOverlay();
  });
}
function paintSpecMode() {
  VC = VR = net.overview ? net.W : CONFIG.SPEC_VIEW; fit();
  $('specMode').textContent = net.overview ? 'Theo dõi 1 người' : 'Toàn cảnh'; net.specTxt = '';
}
function specCycle(step) {
  const ids = net.roster.map((r) => r[0]); if (!ids.length) return;
  let i = ids.indexOf(net.camId); if (i < 0) i = 0; else i = (i + step + ids.length) % ids.length;
  net.follow = ids[i];
  if (net.overview) { net.overview = false; paintSpecMode(); }
}
function specToggle() { net.overview = !net.overview; paintSpecMode(); }
function specJoin() { restoreOffline(); showNameCard(); }

function onEv(e) {
  if (e.t === 'ok') { if (net.me) net.me.grow = Math.min(net.me.grow + (net.GROW || 2), Math.max(0, (net.maxLen || 40) - net.me.cells.length)); toast('Đúng rồi! +' + e.gain + (e.streak > 1 ? '  (liên tiếp ' + e.streak + ')' : ''), 'ok'); sfx('ok'); vib(20); }
  else if (e.t === 'wrong') { toast('Ăn nhầm đáp án ' + e.letter + '! -1 tim', 'bad'); shake(); sfx('bad'); vib(120); }
  else if (e.t === 'bite') { toast('Cắn trúng ' + e.who + ': -' + e.pts + ' điểm, -1 tim', 'bad'); shake(); sfx('hurt'); vib(120); }
  else if (e.t === 'self') { toast('Cắn trúng đuôi! -1 tim', 'bad'); shake(); sfx('hurt'); vib(120); }
  else if (e.t === 'wall') { toast('Đụng ' + ({ W: 'tường', T: 'cây', H: 'nhà', D: 'nhà' }[e.what] || 'vật cản') + '! -1 tim', 'bad'); shake(); sfx('hurt'); vib(120); }
  else if (e.t === 'heart') { toast('+1 tim', 'ok'); sfx('ok'); }
  else if (e.t === 'heartfull') { toast('Tim đã đầy: +' + e.pts + ' điểm', 'ok'); sfx('ok'); }
  else if (e.t === 'dead') { net.me = null; state = 'over'; score = e.score; best = Math.max(best, e.best || 0); updateHud(); sfx('over'); showOverlay(deadHtml()); }
}
function netDir(dx, dy) {   // đổi hướng ngay trên máy, không chờ server
  const m = net.me; if (!m || net.spec || !net.joined) return;
  const last = m.queue.length ? m.queue[m.queue.length - 1] : m.dir;
  if ((dx === -last.x && dy === -last.y) || (dx === last.x && dy === last.y)) return;
  if (m.queue.length < 3) m.queue.push({ x: dx, y: dy });
}
function netMenu() {
  if (state !== 'play' || !net.sock || !net.joined || net.spec) return;
  net.sock.emit('away'); state = 'pause'; showOverlay(menuHtml());
}
function netBack() {
  if (!net.sock) return;
  net.sock.emit('back', null, (r) => {
    if (r && r.dead) { state = 'over'; showOverlay(deadHtml()); } else { state = 'play'; hideOverlay(); }
  });
}
function respawn() {
  if (!net.sock) return;
  net.sock.emit('respawn', null, (r) => { if (r && r.ok) { hearts = r.hearts; score = 0; updateHud(); state = 'play'; hideOverlay(); } });
}

function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(100, ts - (lastTs || ts)); lastTs = ts;
  if (mode === 'online') return drawOnline(ts);
  let prog = 1;
  if (state === 'play') heartTick(dt);
  if (state === 'play' && ts >= holdUntil) {
    if (!tickStart) tickStart = ts;
    if (ts - tickStart >= tickMs) { step(); tickStart = ts; }
    prog = state === 'play' ? Math.min(1, (ts - tickStart) / tickMs) : 1;
  }
  draw(ts, prog);
}

/* ================= Khởi động ================= */
(async function init() {
  paintSound(); updateHud();
  fit();
  if ('ResizeObserver' in window) new ResizeObserver(fit).observe(stage);
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', () => setTimeout(fit, 150));
  await loadQuestions();
  resetSnake(); nextQuestion(); spawnItems();
  fit();
  showStart();
  requestAnimationFrame(loop);
  if (/^https?:$/.test(location.protocol)) resolveServer();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
})();
</script>
